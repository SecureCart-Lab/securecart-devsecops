spring:
  application:
    name: securecart
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:file:/vault/secrets/application-secrets.properties}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securecart}
    username: ${DB_USERNAME:securecart}
    password: ${DB_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

securecart:
  security:
    user:
      username: ${APP_USER_USERNAME:student}
      password: ${APP_USER_PASSWORD:student-local-only}
    admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:admin-local-only}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: securecart

server:
  shutdown: graceful
