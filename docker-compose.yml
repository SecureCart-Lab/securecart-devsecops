services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: securecart
      POSTGRES_USER: securecart
      POSTGRES_PASSWORD: local-dev-password
    ports: ["5432:5432"]
    volumes: ["securecart-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securecart -d securecart"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/securecart
      DB_USERNAME: securecart
      DB_PASSWORD: local-dev-password
      APP_USER_USERNAME: student
      APP_USER_PASSWORD: student-local-only
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: admin-local-only
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  securecart-postgres:
