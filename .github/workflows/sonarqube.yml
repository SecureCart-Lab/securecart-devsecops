name: SonarQube Community Scan
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  sonar:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-sonar'
    runs-on: [self-hosted, linux, securecart]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Test and analyze against SonarQube running on the EC2 workstation
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: >-
          mvn -B clean verify sonar:sonar
          -Ddependency-check.skip=true
          -Dsonar.projectKey=securecart
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.token="$SONAR_TOKEN"
