name: Release Container
on:
  workflow_dispatch:
    inputs:
      gitops_repository:
        description: owner/securecart-gitops
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  release:
    environment: lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Verify source
        run: mvn -B clean verify -Ddependency-check.skip=true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Define image
        run: |
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Push image
        run: docker push "$IMAGE"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: securecart.spdx.json
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Keyless-sign image with GitHub OIDC
        env:
          COSIGN_YES: "true"
        run: cosign sign "$IMAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: securecart-sbom
          path: securecart.spdx.json
      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.gitops_repository }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops
      - name: Update GitOps desired image
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('gitops/charts/securecart/values-lab.yaml')
          s=p.read_text()
          image=os.environ['IMAGE']
          repo,tag=image.rsplit(':',1)
          s=re.sub(r'(?m)^\s*repository: .*$', f'  repository: {repo}', s, count=1)
          s=re.sub(r'(?m)^\s*tag: .*$', f'  tag: "{tag}"', s, count=1)
          p.write_text(s)
          PY
          cd gitops
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add charts/securecart/values-lab.yaml
          git commit -m "release: deploy ${GITHUB_SHA}" || exit 0
          git push

      - name: Optional Slack release notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          payload=$(jq -n --arg text "SecureCart release workflow finished — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text:$text}')
          curl -fsS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
